<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GELM Música - Player</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;padding:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
.app{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:16px;box-sizing:border-box}
.title{font-size:18px;font-weight:600;text-align:center}
.progress{width:70%;height:3px;background:#222;border-radius:4px;overflow:hidden}
.bar{height:100%;width:0%;background:#00ff55}
.controls{display:flex;gap:18px;align-items:center}
.btn{background:none;border:none;color:white;font-size:22px;cursor:pointer;padding:5px}
.btn.save{font-size:18px;color:#00ff55}
select{width:min( min(70vw, 420px), 100%);background:#000;color:#00ff55;border:1px solid #00ff55;padding:6px 12px;border-radius:8px}
.footer{font-size:12px;color:#00ff55}
</style>
</head>
<body>
<div class="app">
  <div class="title" id="songTitle">Cargando…</div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="controls">
    <button class="btn" id="shuffle" aria-label="Aleatorio">🔀</button>
    <button class="btn" id="prev" aria-label="Anterior">⏮</button>
    <button class="btn" id="play" aria-label="Reproducir o pausar">⏯</button>
    <button class="btn" id="next" aria-label="Siguiente">⏭</button>
    <button class="btn save" id="save" aria-label="Guardar canción">💾</button>
  </div>
  <select id="list" aria-label="Seleccionar canción"></select>
  <div class="footer">Created by GELM</div>
</div>
<audio id="audio" preload="none"></audio>
<script>
"use strict";
const audio=document.getElementById("audio");
const title=document.getElementById("songTitle");
const bar=document.getElementById("bar");
const list=document.getElementById("list");
const playButton=document.getElementById("play");
let songs=[];
let index=0;
let shuffle=true;
let pendingPlay=false;
let loadVersion=0;
let failedTracks=new Set();

function updateMediaSession(song){
  if(!("mediaSession" in navigator) || typeof MediaMetadata==="undefined") return;
  navigator.mediaSession.metadata=new MediaMetadata({
    title:song.title||"GT-GELM",
    artist:"GT-GELM",
    album:"Guatemala · Tu nombre inmortal",
    artwork:[
      {src:"../icons/icon-192.png",sizes:"192x192",type:"image/png"},
      {src:"../icons/icon-512.png",sizes:"512x512",type:"image/png"}
    ]
  });
  try{
    navigator.mediaSession.setActionHandler("previoustrack",prev);
    navigator.mediaSession.setActionHandler("nexttrack",next);
    navigator.mediaSession.setActionHandler("play",()=>audio.play().catch(()=>{}));
    navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  }catch(e){}
}

function selectSong(i,autoplay=false){
  if(!songs.length) return;
  index=(i+songs.length)%songs.length;
  const song=songs[index];
  if(!song || !song.url) return;
  loadVersion++;
  pendingPlay=autoplay;
  audio.pause();
  audio.removeAttribute("src");
  audio.src=song.url.trim();
  audio.load();
  title.textContent=song.title||"GT-GELM";
  list.value=String(index);
  localStorage.setItem("lastSong",String(index));
  bar.style.width="0%";
  updateMediaSession(song);
  if(autoplay && audio.readyState>=HTMLMediaElement.HAVE_FUTURE_DATA) startPlayback();
}

async function startPlayback(){
  if(!audio.src) return;
  if(audio.readyState<HTMLMediaElement.HAVE_FUTURE_DATA){
    pendingPlay=true;
    return;
  }
  pendingPlay=false;
  try{
    await audio.play();
  }catch(error){
    console.warn("No se pudo iniciar la reproducción:",error);
    if(error && error.name!=="AbortError") pendingPlay=true;
  }
}

audio.addEventListener("canplay",()=>{
  if(pendingPlay) startPlayback();
});
function next(){
  if(!songs.length) return;
  let target=(index+1)%songs.length;
  if(shuffle && songs.length>1){
    do{target=Math.floor(Math.random()*songs.length)}while(target===index);
  }
  selectSong(target,true);
}
function prev(){
  if(!songs.length) return;
  if(audio.currentTime>3){audio.currentTime=0;startPlayback();return;}
  selectSong(index-1,true);
}

document.getElementById("next").addEventListener("click",next);
document.getElementById("prev").addEventListener("click",prev);
playButton.addEventListener("click",()=>audio.paused?startPlayback():audio.pause());
document.getElementById("shuffle").addEventListener("click",()=>{shuffle=!shuffle;});
list.addEventListener("change",e=>selectSong(Number(e.target.value),true));

audio.addEventListener("timeupdate",()=>{
  if(Number.isFinite(audio.duration)&&audio.duration>0)
    bar.style.width=(audio.currentTime/audio.duration*100)+"%";
});
audio.addEventListener("ended",next);
audio.addEventListener("play",()=>{playButton.textContent="⏸";});
audio.addEventListener("pause",()=>{playButton.textContent="⏯";});
audio.addEventListener("playing",()=>{
  failedTracks.delete(index);
});
audio.addEventListener("error",()=>{
  if(!audio.error) return;
  console.error("Error de audio:",audio.error.code,audio.currentSrc);
  pendingPlay=false;
  if(failedTracks.has(index)) return;
  failedTracks.add(index);
  if(failedTracks.size>=songs.length){
    title.textContent="No se pudieron reproducir las canciones";
    return;
  }
  setTimeout(()=>next(),250);
});

async function loadSongs(){
  try{
    const response=await fetch("../songs.json",{cache:"no-store"});
    if(!response.ok) throw new Error("songs.json respondió "+response.status);
    const raw=(await response.text()).replace(/^\uFEFF/,"");
    const data=JSON.parse(raw);
    if(!Array.isArray(data)) throw new Error("El catálogo no es una lista");
    songs=data.filter(song=>song && typeof song.url==="string" && song.url.trim());
    if(!songs.length) throw new Error("No se encontraron canciones con URL");
    list.replaceChildren();
    songs.forEach((song,i)=>{
      const option=document.createElement("option");
      option.value=String(i);
      option.textContent=song.title||("Canción "+(i+1));
      list.appendChild(option);
    });
    const saved=Number.parseInt(localStorage.getItem("lastSong")||"0",10);
    index=Number.isInteger(saved)&&saved>=0&&saved<songs.length?saved:0;
    selectSong(index,false);
  }catch(error){
    title.textContent="No se pudo cargar songs.json";
    console.error(error);
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));
}
loadSongs();
</script>
</body>
</html>
