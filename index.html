
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GT-GELM Música</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: system-ui, Arial, sans-serif;
}

.app {
  min-height: 100vh;
  padding: 25px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 17px;
  background:
    radial-gradient(ellipse at 20% 10%, #003b4c55, transparent 45%),
    radial-gradient(ellipse at 80% 90%, #51005c44, transparent 45%),
    #000;
}

.brand {
  text-align: center;
  margin-bottom: 8px;
}

.brand h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 4px;
  color: #00eaff;
  text-shadow: 0 0 14px #00eaff;
}

.brand p {
  margin: 5px 0;
  font-size: 10px;
  letter-spacing: 2px;
  color: #aaa;
}

.player {
  width: min(100%, 430px);
  padding: 22px 18px;
  border: 1px solid #25253b;
  border-radius: 18px;
  background: #101019;
  box-shadow: 0 0 25px #00eaff18;
}

.cover {
  display: block;
  width: 125px;
  height: 125px;
  object-fit: cover;
  border-radius: 15px;
  margin: 0 auto 17px;
  border: 1px solid #00eaff;
  box-shadow: 0 0 18px #00eaff55;
}

.title {
  min-height: 25px;
  text-align: center;
  font-size: 18px;
  font-weight: 650;
  overflow-wrap: anywhere;
}

.meta {
  text-align: center;
  color: #999;
  font-size: 11px;
  margin-top: 5px;
}

.timeline {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 22px 0 12px;
  color: #aaa;
  font-size: 11px;
}

#seek {
  flex: 1;
  min-width: 0;
  accent-color: #00eaff;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 13px;
  margin: 17px 0;
}

.btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  color: white;
  background: #252536;
  font-size: 19px;
}

.btn.active {
  color: #00ff88;
  box-shadow: 0 0 12px #00ff8844;
}

.btn.play {
  width: 58px;
  height: 58px;
  color: black;
  background: linear-gradient(135deg, #00eaff, #00ff88);
  font-size: 25px;
}

.volume {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #aaa;
}

#volume {
  flex: 1;
  accent-color: #00eaff;
}

.selector-label {
  display: block;
  margin: 20px 0 8px;
  color: #00ff88;
  font-size: 11px;
  letter-spacing: 1px;
}

select {
  width: 100%;
  padding: 12px;
  border: 1px solid #00eaff;
  border-radius: 9px;
  background: #050509;
  color: #00eaff;
  font-size: 13px;
  outline: none;
}

.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 17px;
}

.action {
  padding: 9px 12px;
  border: 1px solid #343447;
  border-radius: 9px;
  background: #191923;
  color: #00eaff;
  font-size: 11px;
}

.status {
  min-height: 17px;
  margin-top: 12px;
  color: #999;
  font-size: 11px;
  text-align: center;
}

.footer {
  color: #00ff88;
  font-size: 11px;
  letter-spacing: 1px;
  text-align: center;
}

@media(max-width:360px) {
  .controls { gap: 8px; }
  .btn { width: 38px; height: 38px; }
  .btn.play { width: 53px; height: 53px; }
}
</style>
</head>

<body>
<main class="app">

  <header class="brand">
    <h1>GT-GELM</h1>
    <p>GUATEMALA TU NOMBRE INMORTAL</p>
  </header>

  <section class="player">

    <img
      id="cover"
      class="cover"
      src="icons/icon-192.png"
      alt="GT-GELM"
    >

    <div class="title" id="songTitle">Cargando...</div>
    <div class="meta" id="songMeta">GT-GELM · Música variada</div>

    <div class="timeline">
      <span id="currentTime">00:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1">
      <span id="duration">00:00</span>
    </div>

    <div class="controls">
      <button class="btn active" id="shuffle" title="Aleatorio">🔀</button>
      <button class="btn" id="prev" title="Anterior">⏮</button>
      <button class="btn play" id="play" title="Reproducir">▶</button>
      <button class="btn" id="next" title="Siguiente">⏭</button>
      <button class="btn" id="repeat" title="Repetir">🔁</button>
    </div>

    <div class="volume">
      <span>🔉</span>
      <input id="volume" type="range" min="0" max="1" value="0.85" step="0.01">
      <span>🔊</span>
    </div>

    <label class="selector-label" for="list">
      SELECCIONAR CANCIÓN
    </label>

    <select id="list">
      <option value="">Cargando canciones...</option>
    </select>

    <div class="actions">
      <button class="action" id="direct">♫ Audio directo</button>
      <button class="action" id="youtube">▶ YouTube</button>
    </div>

    <div class="status" id="status">Preparando reproductor...</div>

  </section>

  <footer class="footer">CREATED BY GELM</footer>

</main>

<audio id="audio" preload="metadata" playsinline></audio>

<script>
'use strict';

/* CONFIGURACIÓN */
const AUDIO_BASE =
  'https://divine-king-c86b.chapin7839.workers.dev/';

const YOUTUBE_PLAYLIST = 'PLJGpqFTRWh98';

const audio = document.getElementById('audio');
const list = document.getElementById('list');

let songs = [];
let index = -1;
let shuffle = true;
let repeat = false;
let shuffleBag = [];

/* UTILIDADES */
function timeFormat(seconds) {
  if (!Number.isFinite(seconds)) return '00:00';

  seconds = Math.max(0, Math.floor(seconds));

  return String(Math.floor(seconds / 60)).padStart(2, '0')
    + ':' +
    String(seconds % 60).padStart(2, '0');
}

function songURL(file) {
  if (/^https?:\/\//i.test(file)) return file;

  return AUDIO_BASE +
    String(file).split('/').map(encodeURIComponent).join('/');
}

function saveLast(song) {
  try {
    localStorage.setItem('gt-gelm-last-id', String(song.id));
  } catch (_) {}
}

/* CARGAR songs.json */
async function loadSongs() {
  try {
    const response = await fetch('songs.json', {
      cache: 'no-store'
    });

    if (!response.ok) throw new Error('No se pudo cargar songs.json');

    const data = await response.json();

    const rows = Array.isArray(data)
      ? data
      : (Array.isArray(data.songs) ? data.songs : []);

    songs = rows
      .filter(s => s.file || s.filename)
      .map((s, i) => ({
        id: Number(s.id ?? i + 1),
        file: String(s.file || s.filename),
        title: String(s.title || s.file || s.filename),
        category: String(s.category || 'historias').toLowerCase(),
        cover: s.cover || '',
        url: songURL(s.file || s.filename)
      }));

    if (!songs.length) {
      throw new Error('No se encontraron canciones.');
    }

    list.innerHTML = '';

    songs.forEach((song, i) => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent =
        String(song.id).padStart(3, '0') + ' · ' + song.title;

      list.appendChild(option);
    });

    let lastId = null;

    try {
      lastId = Number(localStorage.getItem('gt-gelm-last-id'));
    } catch (_) {}

    const lastIndex = songs.findIndex(s => s.id === lastId);

    index = lastIndex >= 0
      ? lastIndex
      : Math.floor(Math.random() * songs.length);

    refillShuffle();
    playSong(index, false);

    document.getElementById('status').textContent =
      songs.length + ' canciones cargadas';

  } catch (error) {
    console.error(error);
    document.getElementById('songTitle').textContent =
      'Error al cargar canciones';
    document.getElementById('status').textContent = error.message;
  }
}

/* REPRODUCIR CANCIÓN */
function playSong(i, autoplay = true) {
  const song = songs[i];

  if (!song) return;

  index = i;

  audio.pause();
  audio.src = song.url;
  audio.load();

  document.getElementById('songTitle').textContent = song.title;

  document.getElementById('songMeta').textContent =
    'GT-GELM · ' +
    String(song.id).padStart(3, '0') +
    ' · ' +
    song.category.toUpperCase();

  document.getElementById('cover').src =
    song.cover || 'icons/icon-192.png';

  document.getElementById('cover').onerror = () => {
    document.getElementById('cover').onerror = null;
    document.getElementById('cover').src = 'icons/icon-192.png';
  };

  list.value = String(i);

  document.getElementById('currentTime').textContent = '00:00';
  document.getElementById('duration').textContent = '00:00';
  document.getElementById('seek').value = 0;

  saveLast(song);
  updateMediaSession(song);

  if (autoplay) {
    audio.play().catch(error => {
      console.error('Error al reproducir:', error);
      document.getElementById('status').textContent =
        'No se pudo iniciar · toca reproducir';
    });
  }
}

/* ALEATORIO */
function refillShuffle() {
  shuffleBag = songs
    .map((_, i) => i)
    .filter(i => i !== index);

  for (let i = shuffleBag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [shuffleBag[i], shuffleBag[j]] =
      [shuffleBag[j], shuffleBag[i]];
  }
}

/* SIGUIENTE */
function next() {
  if (!songs.length) return;

  if (repeat) {
    playSong(index, true);
    return;
  }

  let nextIndex;

  if (shuffle) {
    if (!shuffleBag.length) refillShuffle();
    nextIndex = shuffleBag.pop();
  } else {
    nextIndex = (index + 1) % songs.length;
  }

  if (nextIndex !== undefined) {
    playSong(nextIndex, true);
  }
}

/* ANTERIOR */
function prev() {
  if (!songs.length) return;

  const previous =
    (index - 1 + songs.length) % songs.length;

  playSong(previous, true);
}

/* AVANCE AUTOMÁTICO */
audio.onended = next;

/* CONTROLES */
document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;

document.getElementById('play').onclick = () => {
  if (audio.paused) {
    if (index < 0 && songs.length) {
      playSong(0, true);
    } else {
      audio.play().catch(console.error);
    }
  } else {
    audio.pause();
  }
};

document.getElementById('shuffle').onclick = () => {
  shuffle = !shuffle;

  document.getElementById('shuffle')
    .classList.toggle('active', shuffle);

  if (shuffle) refillShuffle();
};

document.getElementById('repeat').onclick = () => {
  repeat = !repeat;

  document.getElementById('repeat')
    .classList.toggle('active', repeat);
};

list.onchange = event => {
  const selected = Number(event.target.value);

  if (Number.isInteger(selected)) {
    playSong(selected, true);
  }
};

/* VOLUMEN */
document.getElementById('volume').oninput = event => {
  audio.volume = Number(event.target.value);
};

audio.volume = 0.85;

/* PROGRESO */
audio.ontimeupdate = () => {
  if (audio.duration) {
    document.getElementById('seek').value =
      (audio.currentTime / audio.duration) * 100;
  }

  document.getElementById('currentTime').textContent =
    timeFormat(audio.currentTime);
};

audio.onloadedmetadata = () => {
  document.getElementById('duration').textContent =
    timeFormat(audio.duration);
};

document.getElementById('seek').onchange = event => {
  if (audio.duration) {
    audio.currentTime =
      Number(event.target.value) / 100 * audio.duration;
  }
};

/* ESTADO DEL REPRODUCTOR */
audio.onplay = () => {
  document.getElementById('play').textContent = 'Ⅱ';
  document.getElementById('status').textContent = 'Reproduciendo';

  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'playing';
  }
};

audio.onpause = () => {
  document.getElementById('play').textContent = '▶';

  if ('mediaSession' in navigator) {
    navigator.mediaSession.playbackState = 'paused';
  }
};

audio.onerror = () => {
  console.error('Error de audio:', audio.error, audio.currentSrc);
  document.getElementById('status').textContent =
    'Error al cargar la canción';
};

/* MEDIA SESSION: PANTALLA BLOQUEADA */
function updateMediaSession(song) {
  if (!('mediaSession' in navigator) ||
      typeof MediaMetadata === 'undefined') return;

  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.title,
      artist: 'GT-GELM',
      album: 'Música Variada',
      artwork: [
        {
          src: 'icons/icon-192.png',
          sizes: '192x192',
          type: 'image/png'
        },
        {
          src: 'icons/icon-512.png',
          sizes: '512x512',
          type: 'image/png'
        }
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => {
      audio.play().catch(console.error);
    });

    navigator.mediaSession.setActionHandler('pause', () => {
      audio.pause();
    });

    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', next);

  } catch (error) {
    console.warn('Media Session:', error);
  }
}

/* BOTONES EXTERNOS */
document.getElementById('direct').onclick = () => {
  if (index >= 0) {
    window.open(songs[index].url, '_blank', 'noopener,noreferrer');
  }
};

document.getElementById('youtube').onclick = () => {
  window.open(
    'https://www.youtube.com/playlist?list=' + YOUTUBE_PLAYLIST,
    '_blank',
    'noopener,noreferrer'
  );
};

/* SERVICE WORKER */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .catch(error => console.warn('Service Worker:', error));
  });
}

/* INICIAR */
loadSongs();

</script>
</body>
</html>
