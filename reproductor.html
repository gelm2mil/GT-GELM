<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080914">
  <meta name="description" content="GT-GELM Music Player — música e historias de Guatemala.">
  <title>GT-GELM · Music Player</title>
  <link rel="stylesheet" href="reproductor.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <a class="brand" href="index.html" aria-label="Volver a GT-GELM">
        <span class="brand-mark">G</span>
        <span><b>GT-GELM</b><small>MUSIC PLAYER</small></span>
      </a>
      <span class="library-count" id="libraryCount">118 canciones</span>
    </header>

    <section class="player-card" aria-label="Reproductor musical">
      <div class="cover-frame">
        <img id="cover" src="img/gt-gelm-logo.webp" alt="Carátula del álbum" onerror="this.src='assets/img/default-cover.svg'">
        <span class="cover-label">GT-GELM ORIGINALS</span>
      </div>
      <div class="track-info">
        <p class="eyebrow" id="categoryLabel">LISTO PARA REPRODUCIR</p>
        <h1 id="trackTitle">Selecciona una canción</h1>
        <p id="trackArtist">GT-GELM · Guatemala tu nombre inmortal</p>
      </div>
      <audio id="audio" preload="metadata"></audio>
      <div class="progress-wrap">
        <span id="currentTime">00:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posición de reproducción">
        <span id="duration">00:00</span>
      </div>
      <div class="controls">
        <button id="shuffleBtn" class="sub-control" type="button" aria-label="Reproducción aleatoria" title="Aleatorio">🔀</button>
        <button id="prevBtn" class="sub-control" type="button" aria-label="Anterior" title="Anterior">⏮</button>
        <button id="playBtn" class="play-control" type="button" aria-label="Reproducir">▶</button>
        <button id="nextBtn" class="sub-control" type="button" aria-label="Siguiente" title="Siguiente">⏭</button>
        <button id="repeatBtn" class="sub-control" type="button" aria-label="Repetir" title="Repetir">🔁</button>
      </div>
      <div class="volume-row">
        <span>🔈</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volumen"><span>🔊</span>
      </div>
    </section>

    <section class="library">
      <div class="section-heading">
        <div><p class="eyebrow">TU MÚSICA</p><h2>Biblioteca</h2></div>
        <button id="playlistCreate" class="primary-btn" type="button">＋ Lista</button>
      </div>
      <label class="search-box">
        <span>⌕</span><input id="searchInput" type="search" placeholder="Buscar canción, número o artista…" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="Limpiar búsqueda">×</button>
      </label>
      <div class="chips" id="categoryFilters">
        <button class="chip active" data-category="all" type="button">Todas</button>
        <button class="chip" data-category="cultura" type="button">Cultura</button>
        <button class="chip" data-category="historias" type="button">Historias</button>
        <button class="chip" data-category="pmt" type="button">PMT</button>
      </div>
      <div class="playlist-strip" id="playlistStrip" aria-label="Mis listas"></div>
      <div class="list-heading"><b id="listTitle">Todas las canciones</b><span id="resultCount"></span></div>
      <div class="song-list" id="songList" aria-live="polite"></div>
    </section>
    <footer>GT-GELM · Guatemala tu nombre inmortal</footer>
  </main>

  <dialog id="playlistDialog">
    <form method="dialog" id="playlistForm">
      <h3 id="dialogTitle">Crear lista</h3>
      <label for="playlistName">Nombre de la lista</label>
      <input id="playlistName" maxlength="40" required placeholder="Ej. Mis favoritas">
      <div class="dialog-actions">
        <button class="secondary-btn" value="cancel">Cancelar</button>
        <button class="primary-btn" id="savePlaylist" value="default">Guardar</button>
      </div>
    </form>
  </dialog>
  <dialog id="songActionsDialog">
    <div class="dialog-content">
      <h3 id="songActionTitle">Añadir canción</h3>
      <div id="playlistChoices"></div>
      <button class="secondary-btn full" id="closeSongActions" type="button">Cerrar</button>
    </div>
  </dialog>
  <script src="reproductor.js"></script>
</body>
</html>
